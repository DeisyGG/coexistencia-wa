<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Conectar Coexistencia WhatsApp</title>
</head>
<body>
    <h2 style="font-family: Arial, sans-serif; text-align: center; margin-top: 50px;">Conectar WhatsApp Business API (Modo Coexistencia)</h2>
    
    <div style="text-align: center; margin-top: 30px;">
        <button onclick="launchWhatsAppSignup()" style="background-color: #1877F2; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold;">
            Conectar WhatsApp con mi Móvil
        </button>
    </div>

    <script>
      // 1. Inicializar el SDK de Facebook
      window.fbAsyncInit = function() {
        FB.init({
          appId      : '1522134525970217', // <--- CAMBIA ESTO POR EL ID DE TU APP DE META
          cookie     : true,
          xfbml      : true,
          version    : 'v20.0'
        });
      };

      // Cargar el SDK lógicamente
      (function(d, s, id){
         var js, fjs = d.getElementsByTagName(s)[0];
         if (d.getElementById(id)) {return;}
         js = d.createElement(s); js.id = id;
         js.src = "https://connect.facebook.net/es_LA/sdk.js";
         fjs.parentNode.insertBefore(js, fjs);
       }(document, 'script', 'facebook-jssdk'));

      // 2. Función que abre la ventana con código QR de Meta
      function launchWhatsAppSignup() {
        FB.login(function(response) {
          if (response.authResponse) {
            // Aquí Meta te devuelve el Token de Acceso
            const accessToken = response.authResponse.accessToken;
            alert("¡Conexión Exitosa! Tu Token es: " + accessToken);
            console.log("Copia este token para n8n:", accessToken);
          } else {
            alert('El usuario canceló el inicio de sesión o no terminó el flujo.');
          }
        }, {
          // Permisos estrictos para abrir el QR de WhatsApp
          scope: 'whatsapp_business_management,whatsapp_business_messaging',
          extras: {
            feature: 'coexistence' // <--- Esto le dice a Meta que active la coexistencia
          }
        });
      }
    </script>
</body>
</html>
